[package]
name = "arciin-desktop"
version = "0.1.0"
description = "Arciin Desktop"
edition = "2021"
rust-version = "1.82"

[lib]
name = "arciin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks multi-webview windows. The Arciin window needs two: the
# server's own page, and a small overlay of ours holding the window controls.
# The controls cannot live in the server's page because this client never
# injects script into a remote origin.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
keyring = { version = "3", features = ["windows-native"] }
mdns-sd = "0.13"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gethostname = "1"

[target.'cfg(windows)'.dependencies]
# Must match the versions tauri/wry link against, or the COM interface
# types returned by PlatformWebview::controller() are a different crate.
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # CoTaskMemFree, for strings WebView2 hands back.
    "Win32_System_Com",
] }

[dev-dependencies]
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
