# Every push and pull request. Builds nothing publishable — this is the gate
# that keeps main healthy, not the thing that ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test (windows-latest)
    # Windows-only on purpose: the client is Windows-first and much of the
    # Rust is `#[cfg(windows)]` — WebView2 interop, known folders, the folder
    # picker. A Linux runner would compile a different program.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version consistency
        run: node scripts/check-version.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend types
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust lint
        run: cargo clippy --all-targets
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
