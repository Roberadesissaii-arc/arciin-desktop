<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>Arciin window controls</title>
    <style>
      /*
       * The title bar for the Arciin window.
       *
       * It lives in its own tiny webview, overlaid on the server's page,
       * because this client never injects script into a remote origin. The
       * page underneath belongs to the server; this strip belongs to us, and
       * the two never touch.
       *
       * Sized and shaped to match what Windows itself draws, so it reads as
       * the system's chrome rather than a web widget: the app's own icon and
       * name at the left where a window's identity goes, 46px hit targets at
       * the right, the same hover greys, and a close button that goes red.
       */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        /*
         * The same near-black as Arciin's sidebar (`--sidebar` / `--background`
         * in the web app's globals.css).
         *
         * That is what makes the sidebar read as running the full height: the
         * strip and the sidebar are one continuous colour, so the only stretch
         * that registers as a title bar is the part above the light content
         * pane, which is exactly where the window controls live.
         *
         * Not transparent: two sibling WebView2 instances do not composite on
         * Windows, so a transparent overlay renders as nothing at all.
         */
        background: #09090b;
        user-select: none;
        -webkit-user-select: none;
        /*
         * Without this the name renders with subpixel antialiasing, which puts
         * noticeably more weight on light text over a near-black ground than
         * the same weight carries dark-on-light — and adds colour fringing.
         * Both read as the bar being bolder and rougher than the rest of the
         * application.
         */
        -webkit-font-smoothing: antialiased;
      }

      .bar {
        display: flex;
        align-items: stretch;
        height: 100%;
      }

      /*
       * The window's identity, where Windows puts it: icon then name, hard
       * against the left edge.
       *
       * It is part of the drag region, because on a real title bar the area
       * around the name is what you grab to move the window.
       */
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        padding-left: 11px;
        -webkit-app-region: drag;
        app-region: drag;
      }

      /* The application icon itself — the same one on the taskbar and in the
         Start menu, not a redrawn approximation of it. */
      .brand__icon {
        display: block;
        width: 16px;
        height: 16px;
      }

      /*
       * Windows 11's own title bar face and size. The point is for this to be
       * indistinguishable from the name Windows would have drawn here, so it
       * deliberately does not use the product's display font.
       */
      .brand__name {
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
        color: rgba(255, 255, 255, 0.86);
      }

      /* Everything between the name and the buttons drags the window, the way
         the empty part of a real title bar does. */
      .drag {
        flex: 1 1 auto;
        -webkit-app-region: drag;
        app-region: drag;
      }

      button {
        -webkit-app-region: no-drag;
        app-region: no-drag;
        width: 46px;
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: background-color 0.12s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.09);
      }

      button:active {
        background: rgba(255, 255, 255, 0.14);
      }

      /* The one Windows convention worth keeping exactly: close turns red. */
      .close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      .close:active {
        background: #b0271a;
      }

      /*
       * The caption glyphs, from the font Windows draws its own with.
       *
       * Hand-drawn SVG shapes were what this used before, and they never quite
       * passed: a plain square is not the maximize glyph, and the stroke
       * weights did not match the system's at any size. Taking the real
       * characters from the real font removes the question. `Segoe Fluent
       * Icons` is Windows 11's; `Segoe MDL2 Assets` is the Windows 10 name for
       * the same codepoints.
       */
      .glyph {
        font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
        font-size: 10px;
        line-height: 1;
      }

      /* Hidden until the maximize state is known, so the icon never flips
         visibly on first paint. */
      .restore {
        display: none;
      }

      body.maximized .maximize {
        display: none;
      }

      body.maximized .restore {
        display: inline-flex;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="brand">
        <img class="brand__icon" src="./src-tauri/icons/32x32.png" alt="" />
        <span class="brand__name">Arciin Desktop</span>
      </div>

      <div class="drag"></div>

      <button id="minimize" type="button" title="Minimize" aria-label="Minimize">
        <span class="glyph" aria-hidden="true">&#xE921;</span>
      </button>

      <button id="maximize" class="maximize" type="button" title="Maximize" aria-label="Maximize">
        <span class="glyph" aria-hidden="true">&#xE922;</span>
      </button>

      <button id="restore" class="restore" type="button" title="Restore" aria-label="Restore">
        <span class="glyph" aria-hidden="true">&#xE923;</span>
      </button>

      <button id="close" class="close" type="button" title="Close" aria-label="Close">
        <span class="glyph" aria-hidden="true">&#xE8BB;</span>
      </button>
    </div>

    <script type="module">
      import { getCurrentWindow } from "@tauri-apps/api/window"

      const appWindow = getCurrentWindow()

      /** Keep the maximize/restore icon honest, including after a double-click drag. */
      async function syncMaximized() {
        try {
          document.body.classList.toggle("maximized", await appWindow.isMaximized())
        } catch {
          // Not fatal: the wrong icon is better than a broken title bar.
        }
      }

      document.getElementById("minimize").addEventListener("click", () => {
        void appWindow.minimize()
      })

      for (const id of ["maximize", "restore"]) {
        document.getElementById(id).addEventListener("click", async () => {
          await appWindow.toggleMaximize()
          await syncMaximized()
        })
      }

      document.getElementById("close").addEventListener("click", () => {
        void appWindow.close()
      })

      void appWindow.onResized(syncMaximized)
      void syncMaximized()

      /*
       * WebView2's own context menu has no business on the window controls.
       * There is nothing here to cut, copy or paste, so unlike the shell this
       * suppresses the menu without offering one in its place — the
       * alternative is Save as and developer tools on a right-click of the
       * title bar.
       */
      document.addEventListener("contextmenu", (event) => {
        event.preventDefault()
      })
    </script>
  </body>
</html>
