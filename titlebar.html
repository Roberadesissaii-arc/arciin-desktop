<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>Arciin window controls</title>
    <style>
      /*
       * The window controls for the Arciin window.
       *
       * They live in their own tiny webview, overlaid on the server's page,
       * because this client never injects script into a remote origin. The
       * page underneath belongs to the server; this strip belongs to us, and
       * the two never touch.
       *
       * Sized and shaped to match what Windows itself draws, so it reads as
       * the system's chrome rather than a web widget: 46x32 hit targets, the
       * same hover greys, and a close button that goes red.
       */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        /*
         * The same near-black as Arciin's sidebar (`--sidebar` / `--background`
         * in the web app's globals.css).
         *
         * That is what makes the sidebar read as running the full height: the
         * strip and the sidebar are one continuous colour, so the only stretch
         * that registers as a title bar is the part above the light content
         * pane, which is exactly where the window controls live.
         *
         * Not transparent: two sibling WebView2 instances do not composite on
         * Windows, so a transparent overlay renders as nothing at all.
         */
        background: #09090b;
        user-select: none;
        -webkit-user-select: none;
        /*
         * The shell sets this on its own body, and without it here the two
         * lockups do not match: subpixel antialiasing renders light text on a
         * near-black ground noticeably heavier than the same weight renders
         * dark-on-light, and its colour fringing is what reads as the mark
         * looking rough.
         */
        -webkit-font-smoothing: antialiased;
      }

      /* The shell's heading face, so the two lockups are the same lettering
         and not merely the same words. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("./src/assets/fonts/SpaceGrotesk-VariableFont_wght.ttf")
          format("truetype-variations");
        font-weight: 300 700;
        font-display: swap;
      }

      .bar {
        display: flex;
        align-items: stretch;
        justify-content: flex-end;
        height: 100%;
      }

      /* Dragging by the logo moves the window, as it would on any title bar. */
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        padding-left: 12px;
        -webkit-app-region: drag;
        app-region: drag;
      }

      /*
       * Scaled from the shell's 18x20 to sit inside a 26px bar, keeping the
       * shell's ratio of mark height to wordmark size (20:17) so the arch does
       * not read as heavier beside smaller lettering than it does up there.
       *
       * `geometricPrecision` matters at this size: the arch is a 70-unit
       * stroke in a 245-unit viewBox, which lands on about three physical
       * pixels, and the default speed-first rasterisation makes its apex
       * visibly blocky.
       */
      .brand__mark {
        display: block;
        width: 12px;
        height: 15px;
        shape-rendering: geometricPrecision;
      }

      .brand__word {
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1;
        color: rgba(255, 255, 255, 0.92);
      }

      .brand__word span {
        color: #ff4f12;
      }

      /* Everything left of the buttons drags the window, the way the empty
         part of a real title bar does. */
      .drag {
        flex: 1 1 auto;
        -webkit-app-region: drag;
        app-region: drag;
      }

      button {
        -webkit-app-region: no-drag;
        app-region: no-drag;
        width: 46px;
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: background-color 0.12s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.09);
      }

      button:active {
        background: rgba(255, 255, 255, 0.14);
      }

      /* The one Windows convention worth keeping exactly: close turns red. */
      .close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      .close:active {
        background: #b0271a;
      }

      svg {
        display: block;
      }

      /* Hidden until the maximize state is known, so the icon never flips
         visibly on first paint. */
      .restore {
        display: none;
      }

      body.maximized .maximize {
        display: none;
      }

      body.maximized .restore {
        display: inline-flex;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <!--
        The same lockup the onboarding shell shows at its top-left, so the
        window is identifiably Arciin's before the server's page has painted
        anything. White rather than near-black here because this band is the
        sidebar's colour, which is how the web app draws it too.
      -->
      <div class="brand">
        <svg
          class="brand__mark"
          viewBox="130 95 245 320"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <polyline
            points="152,400 256,108 360,400"
            fill="none"
            stroke="#FF4F12"
            stroke-width="70"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        <span class="brand__word">Arciin<span>.</span></span>
      </div>

      <div class="drag"></div>

      <button id="minimize" type="button" title="Minimize" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>

      <button id="maximize" class="maximize" type="button" title="Maximize" aria-label="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <rect
            x="0.5"
            y="0.5"
            width="9"
            height="9"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
          />
        </svg>
      </button>

      <button id="restore" class="restore" type="button" title="Restore" aria-label="Restore">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <rect
            x="0.5"
            y="2.5"
            width="7"
            height="7"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
          />
          <path d="M2.5 2.5V0.5H9.5V7.5H7.5" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>

      <button id="close" class="close" type="button" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>
    </div>

    <script type="module">
      import { getCurrentWindow } from "@tauri-apps/api/window"

      const appWindow = getCurrentWindow()

      /** Keep the maximize/restore icon honest, including after a double-click drag. */
      async function syncMaximized() {
        try {
          document.body.classList.toggle("maximized", await appWindow.isMaximized())
        } catch {
          // Not fatal: the wrong icon is better than a broken title bar.
        }
      }

      document.getElementById("minimize").addEventListener("click", () => {
        void appWindow.minimize()
      })

      for (const id of ["maximize", "restore"]) {
        document.getElementById(id).addEventListener("click", async () => {
          await appWindow.toggleMaximize()
          await syncMaximized()
        })
      }

      document.getElementById("close").addEventListener("click", () => {
        void appWindow.close()
      })

      void appWindow.onResized(syncMaximized)
      void syncMaximized()

      /*
       * WebView2's own context menu has no business on the window controls.
       * There is nothing here to cut, copy or paste, so unlike the shell this
       * suppresses the menu without offering one in its place — the
       * alternative is Save as and developer tools on a right-click of the
       * title bar.
       */
      document.addEventListener("contextmenu", (event) => {
        event.preventDefault()
      })
    </script>
  </body>
</html>
